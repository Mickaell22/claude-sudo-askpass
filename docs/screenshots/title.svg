<svg xmlns="http://www.w3.org/2000/svg" width="820" height="120" viewBox="0 0 820 120" fill="none" role="img" aria-label="claude-sudo-askpass">
  <rect width="820" height="120" rx="18" fill="#1e1e2e"/> <!-- fondo propio: legible en tema claro y oscuro -->
  <defs>
    <clipPath id="franja1"><rect x="0" y="40" width="820" height="12"/></clipPath>
    <clipPath id="franja2"><rect x="0" y="64" width="820" height="9"/></clipPath>
  </defs>
  <g font-family="'DejaVu Sans Mono','JetBrains Mono','Consolas',monospace" font-size="44" font-weight="bold" text-anchor="middle">
    <!-- copia rosa -->
    <text x="410" y="74" fill="#f38ba8" opacity="0.85">claude-sudo-askpass
      <animateTransform attributeName="transform" type="translate" calcMode="discrete" dur="3s" repeatCount="indefinite"
        keyTimes="0;0.78;0.81;0.84;0.87;0.9;0.93;1" values="0 0;-4 0;3 -2;-6 1;2 0;-3 2;0 0;0 0"/>
    </text>
    <!-- copia celeste -->
    <text x="410" y="74" fill="#89dceb" opacity="0.85">claude-sudo-askpass
      <animateTransform attributeName="transform" type="translate" calcMode="discrete" dur="3s" repeatCount="indefinite"
        keyTimes="0;0.78;0.81;0.84;0.87;0.9;0.93;1" values="0 0;5 1;-3 0;6 -1;-2 2;4 0;0 0;0 0"/>
    </text>
    <!-- texto nitido -->
    <text x="410" y="74" fill="#cdd6f4">claude-sudo-askpass</text>
    <!-- franjas que se corren -->
    <g clip-path="url(#franja1)">
      <rect x="0" y="40" width="820" height="12" fill="#1e1e2e" opacity="0">
        <animate attributeName="opacity" calcMode="discrete" dur="3s" repeatCount="indefinite" keyTimes="0;0.8;0.88;1" values="0;1;0;0"/>
      </rect>
      <text x="410" y="74" fill="#cdd6f4" opacity="0">claude-sudo-askpass
        <animate attributeName="opacity" calcMode="discrete" dur="3s" repeatCount="indefinite" keyTimes="0;0.8;0.88;1" values="0;1;0;0"/>
        <animateTransform attributeName="transform" type="translate" calcMode="discrete" dur="3s" repeatCount="indefinite"
          keyTimes="0;0.8;0.84;0.88;1" values="0 0;18 0;-12 0;0 0;0 0"/>
      </text>
    </g>
    <g clip-path="url(#franja2)">
      <rect x="0" y="64" width="820" height="9" fill="#1e1e2e" opacity="0">
        <animate attributeName="opacity" calcMode="discrete" dur="3s" repeatCount="indefinite" keyTimes="0;0.83;0.92;1" values="0;1;0;0"/>
      </rect>
      <text x="410" y="74" fill="#f5c2e7" opacity="0">claude-sudo-askpass
        <animate attributeName="opacity" calcMode="discrete" dur="3s" repeatCount="indefinite" keyTimes="0;0.83;0.92;1" values="0;1;0;0"/>
        <animateTransform attributeName="transform" type="translate" calcMode="discrete" dur="3s" repeatCount="indefinite"
          keyTimes="0;0.83;0.87;0.92;1" values="0 0;-22 0;10 0;0 0;0 0"/>
      </text>
    </g>
  </g>
</svg>
